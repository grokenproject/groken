[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Required for the launch script + invariant handler (many constructor args).
# Production contracts compile without via-ir; see AUDIT.md.
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./" }]
auto_detect_solc = true

# Official Uniswap V2 pins (0.5.16 / 0.6.6). Not compiled with via-ir / cancun.
additional_compiler_profiles = [
    { name = "uniswap-v2-core", via_ir = false, evm_version = "istanbul", optimizer_runs = 999999 },
    { name = "uniswap-v2-periphery", via_ir = false, evm_version = "istanbul", optimizer_runs = 999999 },
]
compilation_restrictions = [
    { paths = "lib/uniswap-v2-core/**", version = "=0.5.16", via_ir = false },
    { paths = "lib/uniswap-v2-periphery/**", version = "=0.6.6", via_ir = false },
    { paths = "lib/uniswap-lib/**", version = "=0.6.6", via_ir = false },
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 20
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# Public RPCs for optional local/testnet use. No private keys. No mainnet deploy.
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
